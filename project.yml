name: Busk
options:
  bundleIdPrefix: com.potatoman03
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Busk:
    type: application
    platform: iOS
    sources:
      - Busk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.potatoman03.busk
        PRODUCT_NAME: Busk
        INFOPLIST_FILE: Busk/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  BuskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BuskTests
    dependencies:
      - target: Busk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.potatoman03.busk.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Busk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Busk"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BuskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BuskUITests
    dependencies:
      - target: Busk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.potatoman03.busk.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Busk
schemes:
  Busk:
    build:
      targets:
        Busk: all
    test:
      gatherCoverageData: true
      targets:
        - BuskTests
        - BuskUITests
